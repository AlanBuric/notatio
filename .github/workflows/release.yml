name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      checks: read
      pull-requests: read
      # Required for npm provenance, which signs the package against this run.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # Fails the release rather than publishing a version that does not match the tag.
      - name: Check the tag matches the package version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          test "$tag" = "$version" || {
            echo "Tag $tag does not match package version $version"
            exit 1
          }

      # ci.yml already typechecks, lints, tests and builds this commit on push to main.
      # Wait for that to go green instead of redoing it here.
      - name: Wait for CI to pass on this commit
        uses: lewagon/wait-on-check-action@v1.9.1
        with:
          ref: ${{ github.sha }}
          check-name: 'Typecheck, lint, test, build'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@26
          registry-url: https://registry.npmjs.org
          cache: true

      - run: pnpm run build

      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate release notes
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME}"
          body="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$tag" --jq .body)"
          {
            echo "Changelog: https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md#$tag"
            echo
            echo "$body"
          } > release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        if: github.event_name == 'push'
        run: gh release create "${GITHUB_REF_NAME}" --notes-file release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
